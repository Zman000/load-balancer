services:
  lb:
    build: .
    ports:
      - "8080:8080" # Windows localhost:8080 to the container
      - "2112:2112" # Windows localhost:2112 to the container for Prometheus
    depends_on:
      - backend1
      - backend2
      - backend3

  backend1:
    image: golang:1.26-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: go run cmd/backend.go -port 9000 -delay 1s

  backend2:
    image: golang:1.26-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: go run cmd/backend.go -port 9000 -delay 2s

  backend3:
    image: golang:1.26-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: go run cmd/backend.go -port 9000

  loadtest:
      image: golang:1.26-alpine
      working_dir: /app
      volumes:
        - .:/app
      profiles: ["bench"]
      command: go run cmd/loadtest/loadTest.go -target lb:8080 -clients 500 -rampup 1ms
      depends_on:
        - lb
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - lb

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus