server:
    listen_address: "localhost:8080"
    max_connections: 5000

load_balancer:
    algorithm: "least_connections"
    connection_timeout: "1s"

health_check:
    enabled: true
    timeout: "1s"
    interval: "5s"

print_status:
    enabled: true

rate_limit:
    requests_per_sec: 1000
    burst_cap: 500

circuit_breaker:
    max_failures: 3
    cooldown: "5s"

retry:
    max_retries: 3
    initial_backoff: "100ms"

backends:
    - "localhost:9000"
    - "localhost:9001"
    - "localhost:9002"
    - "localhost:9003"