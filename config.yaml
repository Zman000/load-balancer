server:
    listen_address: "localhost:8080"

load_balancer:
    algorithm: "round_robin"
    connection_timeout: "1s"

health_check:
    enabled: true
    timeout: "1s"
    interval: "5s"

print_status:
    enabled: true

rate_limit:
    requests_per_sec: 100
    burst_cap: 50

backends:
    - "localhost:9000"
    - "localhost:9001"
    - "localhost:9002"
    - "localhost:9003"