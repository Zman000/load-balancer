server:
    listen_address: "0.0.0.0:8080"
    max_connections: 500

load_balancer:
    algorithm: "least_connections"
    connection_timeout: "1s"

health_check:
    enabled: true
    timeout: "1s"
    interval: "5s"

print_status:
    enabled: true

rate_limit:
    requests_per_sec: 100
    burst_cap: 50

circuit_breaker:
    max_failures: 3
    cooldown: "5s"

retry:
    max_retries: 3
    initial_backoff: "100ms"

idle_timeout: 60s

backends:
  - "backend1:9000"
  - "backend2:9000"
  - "backend3:9000"